# ---------------------------------------------------------------------------
# Tourney – lisää nämä rivit tiedostoon /home/container/nginx/conf.d/default.conf
# server { } -lohkon sisään, ENNEN riviä "location ~ \.php$".
#
# Miksi: Tourney suojaa app/- ja uploads/-kansiot .htaccess-tiedostoilla,
# mutta nginx ei lue .htaccess-tiedostoja. Nämä säännöt tekevät saman nginxissä.
# ---------------------------------------------------------------------------

# Koodi, config.php ja istunnot: ei koskaan selaimeen
location ^~ /app/ { deny all; return 404; }
location ^~ /pterodactyl/ { deny all; return 404; }

# Ladatut kuvat: tarjoillaan, mutta mitään koodia ei ajeta eikä näytetä
location ^~ /uploads/ {
    add_header X-Content-Type-Options "nosniff" always;
    location ~* \.(php|php[0-9]|phtml|phar|pht|cgi|pl|py|sh|svg|html?)$ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }
}

# Piilotiedostot (.git, .htaccess, .env …) ja asennus-/dokumenttitiedostot
location ~ /\.(?!well-known/) { deny all; return 404; }
location ~* \.(sql|md|txt|sh|sample\.php)$ { deny all; return 404; }
location = /Dockerfile { deny all; return 404; }

# index.php hakemistojen oletussivuksi (vastaa .htaccessin DirectoryIndex-riviä)
index index.php index.html;
